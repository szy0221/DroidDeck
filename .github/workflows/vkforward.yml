name: Build vkforward (Mali Vulkan forwarding layer)

# Route B places a forwarding ICD in the proot Linux runtime. The runtime cannot
# be tested here, but everything else can be, on genuine hardware for the GPU:
# push-mode loops below run the forwarding layer against lavapipe on a native
# aarch64 runner, which exercises exactly the same code paths the tablet uses.

on:
  push:
    paths:
      - 'tools/vkforward/**'
      - '.github/workflows/vkforward.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vkforward-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  runtime-aarch64:
    name: Build and verify against lavapipe (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libvulkan-dev libvulkan1 mesa-vulkan-drivers vulkan-tools gdb

      - name: Show the software driver we will forward to
        run: ls -l /usr/share/vulkan/icd.d/

      - name: Build
        run: bash tools/vkforward/scripts/build-linux.sh

      - name: Loopback check, forwarded properties come back intact
        env:
          VKFW_DRIVER: /usr/lib/aarch64-linux-gnu/libvulkan_lvp.so
        # A hang has to say where it hung. Both halves live in this process, so
        # a driver that never answers leaves nothing behind but a job that runs
        # until it is killed, with only whatever made it to stdout. A watchdog
        # attaches gdb and prints every thread's stack before killing it.
        run: |
          tools/vkforward/build-linux/vkfw_loopback /tmp/vkfw-loopback.sock &
          pid=$!
          ( sleep 120
            if kill -0 "$pid" 2>/dev/null; then
              echo "::error::loopback hung; stacks of the threads that are stuck:"
              gdb -batch -ex "thread apply all bt" -p "$pid" 2>&1 | head -80
              kill -ABRT "$pid" 2>/dev/null
            fi ) &
          watchdog=$!
          wait "$pid"
          rc=$?
          kill "$watchdog" 2>/dev/null || true
          exit "$rc"

      - name: Run the ICD through the real loader
        env:
          VKFW_DRIVER: /usr/lib/aarch64-linux-gnu/libvulkan_lvp.so
        run: |
          set -euxo pipefail
          cd tools/vkforward/build-linux
          ./vkfw_server /tmp/vkfw-probe.sock &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do [ -S /tmp/vkfw-probe.sock ] && break; sleep 0.2; done
          # No VKFW_TRACE here. The trace names every entry point this ICD
          # cannot serve, and the loader asks for several hundred up front,
          # which is the right thing to hand someone debugging on a device and
          # the wrong thing to put in a passing log.
          VK_ICD_FILENAMES="$PWD/vkforward_icd.aarch64.json" \
            VKFW_SOCKET=/tmp/vkfw-probe.sock \
            bash ../scripts/run-with-backtrace.sh \
            "$RUNNER_TEMP/loader-probe.txt" ./vkfw_loader_probe

      - name: Sanity check, vulkaninfo talks to the driver without us
        run: |
          set -euxo pipefail
          VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json \
            vulkaninfo --summary | tee "$RUNNER_TEMP/vulkaninfo-native.txt"
          grep -qi 'llvmpipe\|lavapipe' "$RUNNER_TEMP/vulkaninfo-native.txt"

      - name: End-to-end vulkaninfo through the real loader
        env:
          VKFW_DRIVER: /usr/lib/aarch64-linux-gnu/libvulkan_lvp.so
        run: |
          set -euxo pipefail
          cd tools/vkforward/build-linux
          ./vkfw_server /tmp/vkfw-server.sock &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do [ -S /tmp/vkfw-server.sock ] && break; sleep 0.2; done
          VK_ICD_FILENAMES="$PWD/vkforward_icd.aarch64.json" \
            VKFW_SOCKET=/tmp/vkfw-server.sock \
            bash ../scripts/run-with-backtrace.sh \
            "$RUNNER_TEMP/vulkaninfo-summary.txt" vulkaninfo --summary
          grep -qi 'llvmpipe\|lavapipe' "$RUNNER_TEMP/vulkaninfo-summary.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: vkforward-runtime-aarch64
          path: |
            tools/vkforward/build-linux/libvulkan_vkforward.so
            tools/vkforward/build-linux/vkforward_icd.aarch64.json
            tools/vkforward/build-linux/vkfw_server

  runtime-icd:
    # The ICD is what the runtime loads, and the runtime is a bullseye rootfs,
    # so it is built in the image it has to load in rather than on this runner.
    name: Build the runtime ICD (aarch64, glibc 2.31)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build in Debian bullseye
        run: |
          set -euxo pipefail
          docker run --rm -v "$PWD:/work" -w /work \
            public.ecr.aws/docker/library/debian:bullseye \
            bash tools/vkforward/scripts/build-in-bullseye.sh
          sudo chown -R "$(id -u):$(id -g)" tools/vkforward/build-runtime

      - uses: actions/upload-artifact@v4
        with:
          name: vkforward-linux-aarch64
          path: |
            tools/vkforward/build-runtime/vkforward-linux-aarch64.zip
            tools/vkforward/build-runtime/vkforward_icd.aarch64.json

  android-server:
    name: Build the app-side server with the NDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install the NDK side by side of the app build
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"

      - name: Build the forwarding library for aarch64 Android
        run: |
          set -euxo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          OUT="$PWD/tools/vkforward/build-android"
          mkdir -p "$OUT"
          WARN="-Wall -Wextra -Wno-unused-parameter -Wno-missing-field-initializers"
          "$CLANG" -O2 -fPIC -shared $WARN \
            -I tools/vkforward/common -I tools/vkforward/server \
            -o "$OUT/libvkforward_server.so" \
            tools/vkforward/server/vkfw_server_core.c \
            tools/vkforward/server/vk_forward_server.c \
            tools/vkforward/common/vkfw_codec.c \
            tools/vkforward/common/vkfw_transport.c \
            tools/vkforward/common/vkfw_pnext_sizes.c \
            -ldl -llog

      - uses: actions/upload-artifact@v4
        with:
          name: vkforward-android-server
          path: tools/vkforward/build-android/libvkforward_server.so
